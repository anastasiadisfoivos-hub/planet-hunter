# After each nightly planet sweep (hunt/ci/sweep.yml): download its candidates artifact and run
# `python -m api.finder_ingest` against the production database: upsert candidates, dismiss the
# ones now on a TOI/CTOI/confirmed/EB list, pixel-check new ones.
# DEPLOY: move to .github/workflows/finder.yml. Needs the repo secret PH_DATABASE_URL.
# Two names below must match hunt/ci/sweep.yml once it is on main: the workflow `name:` under
# `workflow_run.workflows` and the artifact name in SWEEP_ARTIFACT.
name: finder-ingest

on:
  workflow_run:
    workflows: ["sweep"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Sweep run id to ingest (default: the latest successful sweep)"
        required: false

concurrency:
  group: finder-ingest
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # to download another workflow run's artifact

env:
  SWEEP_ARTIFACT: candidates

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PH_DATABASE_URL: ${{ secrets.PH_DATABASE_URL }}
      PH_DB_POOL_MAX: "2"
      PH_ADAPTERS: real
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Which sweep run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.run_id }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          run="${EVENT_RUN:-$INPUT_RUN}"
          if [ -z "$run" ]; then
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sweep.yml --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$run" ] || { echo "no successful sweep run found"; exit 1; }
          echo "id=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SWEEP_ARTIFACT }}
          path: sweep
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      # hunter's cached known-list answers (7-day TTL; not its FITS downloads) and pixels' cutouts,
      # so nightly runs stay short.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/planet-hunter/pipeline/json
            ~/.cache/planet-hunter/pixels
          key: finder-http-${{ github.run_id }}
          restore-keys: finder-http-
      - name: Ingest
        working-directory: api
        run: |
          # The candidates are the <tic>_<n>.json files, wherever the artifact put them.
          first=$(find ../sweep -type f -regextype posix-extended \
                  -regex '.*/[0-9]+_[0-9]+\.json' | head -1)
          [ -n "$first" ] || { echo "no candidates in the artifact"; exit 1; }
          sens=$(find ../sweep -type f -name 'sensitivity*.json' | head -1)
          uv sync --frozen --no-dev
          uv run --no-dev python -m api.finder_ingest --dir "$(dirname "$first")" \
            ${sens:+--sensitivity "$sens"} --pixel-limit 20 --time-budget-min 90 \
            | tee summary.json
      - name: Summary
        if: always()
        working-directory: api
        run: |
          { echo '### Finder ingest'; echo '```json'; cat summary.json 2>/dev/null; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
