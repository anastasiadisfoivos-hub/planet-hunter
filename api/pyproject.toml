[project]
name = "planet-hunter-api"
version = "0.1.0"
description = "planet-hunter phenomena spotter API: live sky events and Analyze a star"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "skyevents",
    "skypictures",
    "skysources",
    "hunter",
]

[project.optional-dependencies]
# Only `python -m api.finder_ingest` pixel-checks candidates; the web API never imports it, so
# its deploy stays small. CI: `uv sync --extra finder`.
finder = ["skypixels"]

[tool.uv.sources]
skyevents = { path = "../events", editable = true }
skypictures = { path = "../images", editable = true }
skysources = { path = "../sources", editable = true }
hunter = { path = "../pipeline", editable = true }
skypixels = { path = "../pixels", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
