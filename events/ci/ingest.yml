# Example GitHub Action for the events feed. Copy to .github/workflows/events-ingest.yml
# (it lives here because the EVENTS package may only touch events/).
name: events-ingest

on:
  schedule:
    - cron: "17 * * * *"   # hourly; use "17 6 * * *" for daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: events
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/skysources
          key: skysources-${{ github.run_id }}
          restore-keys: skysources-
      - run: uv sync --frozen
      - run: uv run events-ingest --since 7d --out out/events.json
      - uses: actions/upload-artifact@v4
        with:
          name: events
          path: |
            events/out/events.json
            events/out/status.json
